name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Provide legacy workspace path
        run: sudo ln -s "$GITHUB_WORKSPACE" /workspace

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run complete test suite
        run: python -m pytest

      - name: Compile Python packages
        run: python -m compileall -q research orchestrator

      - name: Verify wheel and read-only safety
        run: python scripts/ci/verify_release_integrity.py
