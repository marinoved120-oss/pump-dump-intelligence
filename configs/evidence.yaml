spot_futures:
  price:
    min_move_bps: 30.0
    leadership_margin_bps: 15.0

  flow:
    min_imbalance: 0.15

  open_interest:
    rise_pct: 0.05
    fall_pct: 0.05

  basis:
    expansion_bps: 5.0

  funding:
    high_rate: 0.0005

  liquidations:
    min_volume: 10.0
    short_to_long_ratio: 3.0

  sequence:
    prior_move_bps: 50.0

  reporting:
    min_score: 0.60
    missing_oi_penalty: 0.15
    missing_liquidation_penalty: 0.15
    missing_funding_penalty: 0.05
    include_interpretation: true
    include_counterexamples: true
    keep_spot_futures_leadership_separate: true

causal_engine:
  scoring:
    support_threshold: 0.60
    reject_below_score: 0.25
    orange_score: 0.65
    red_score: 0.80
    contradiction_penalty: 0.50

  independence:
    support_reference_confirmations: 3
    confidence_group_reference: 3
    min_groups_for_red: 2
    min_confirmations_for_red: 2
    deduplicate_by_correlation_key: true

  data_quality:
    missing_data_penalty: 0.12

  invalidation:
    trigger_strength: 0.70

  reporting:
    include_supporting_evidence: true
    include_contradicting_evidence: true
    include_missing_data: true
    include_invalidation_rules: true
    include_alternative_scenarios: true
    weaken_unsupported_causal_claims: true
    prohibit_single_group_red_alerts: true
