version: 1
policy:
  one_pending_change_at_a_time: true
  stop_after_failed_validation: true
  serious_changes_require_approval: true

tasks:
  - id: V030-001
    title: Live recorder schemas and sequence integrity
    description: >-
      Add immutable schemas for spot and futures depth updates, trades, open interest,
      funding and liquidations. Add sequence-gap detection and resynchronization state
      without starting a live collector yet.
    acceptance_criteria:
      - Spot and futures records have explicit market_type and exchange timestamps.
      - Depth updates cannot be applied across a sequence gap.
      - Missing or stale source data lowers data-quality status.
      - Unit tests cover ordered updates, duplicates, gaps and resync.
    allowed_paths:
      - research/live
      - tests/test_live_schemas.py
      - tests/test_orderbook_sequence.py
      - configs/live.yaml
      - README.md
      - CHANGELOG.md
    risk_level: HIGH
    requires_approval: true

  - id: V030-002
    title: Binance spot and futures WebSocket recorder
    description: >-
      Implement independent spot and USD-M futures collectors for depth and public trades,
      with snapshot bootstrap, update-ID validation, reconnect backoff and durable event logs.
    acceptance_criteria:
      - Spot and futures books are reconstructed independently.
      - Any missing update forces snapshot resynchronization.
      - Raw events are retained before aggregation.
      - Secrets are not required for public market streams.
      - Replay tests reproduce the same final book.
    allowed_paths:
      - research/live
      - tests/test_live_collectors.py
      - tests/fixtures/orderbook
      - configs/live.yaml
      - docker-compose.yml
      - README.md
      - CHANGELOG.md
    risk_level: HIGH
    requires_approval: true

  - id: V030-003
    title: Whale wall persistence and liquidity-pull engine
    description: >-
      Detect relative large limit orders, persistence, execution, cancellation, refill,
      repositioning and liquidity removal separately for spot and futures.
    acceptance_criteria:
      - Whale thresholds are relative to local depth and historical percentiles.
      - A wall is not labelled real or fake from size alone.
      - Every detected wall has a lifecycle and supporting observations.
      - Spot and futures results remain separate and comparable.
    allowed_paths:
      - research/orderbook
      - research/live
      - tests/test_wall_tracker.py
      - configs/orderbook.yaml
      - README.md
      - CHANGELOG.md
    risk_level: HIGH
    requires_approval: true

  - id: V030-004
    title: Spoofing iceberg and absorption evidence
    description: >-
      Add evidence scores for repeated cancellation before touch, order repositioning,
      visible-size refill, executed-to-visible volume and price response. Findings must be
      worded as evidence-compatible hypotheses, not accusations.
    acceptance_criteria:
      - Spoofing score uses lifetime, distance, cancellation, execution and repetition.
      - Iceberg proxy uses refill and executed-to-visible volume.
      - Absorption requires aggressive flow with weak price response.
      - Reports include evidence, contradictions and confidence.
    allowed_paths:
      - research/orderbook
      - research/evidence
      - tests/test_manipulation_evidence.py
      - configs/orderbook.yaml
      - README.md
      - CHANGELOG.md
    risk_level: HIGH
    requires_approval: true

  - id: V030-005
    title: Spot futures divergence and derivatives context
    description: >-
      Combine spot and futures flow, depth, basis, open interest, funding and liquidations
      to distinguish organic spot demand, short squeeze, futures-led pump and late-long buildup.
    acceptance_criteria:
      - OI price combinations have explicit interpretations and counterexamples.
      - Missing OI or liquidation data lowers confidence.
      - Spot-led and futures-led movements are separately classified.
      - Tests cover short squeeze and late-long buildup sequences.
    allowed_paths:
      - research/evidence
      - research/derivatives
      - tests/test_spot_futures_evidence.py
      - configs/evidence.yaml
      - README.md
      - CHANGELOG.md
    risk_level: HIGH
    requires_approval: true

  - id: V030-006
    title: Causal evidence and contradiction engine
    description: >-
      Build market-phase hypotheses, pump-cause hypotheses, dump-mechanism hypotheses,
      alternative scenarios, contradictions, missing-data statements and invalidation rules.
    acceptance_criteria:
      - No red alert can be produced from one evidence group.
      - Correlated features do not count as independent confirmations.
      - Every hypothesis lists supporting and contradicting evidence.
      - Unsupported causal claims are rejected or weakened.
    allowed_paths:
      - research/evidence
      - tests/test_causal_engine.py
      - configs/evidence.yaml
      - README.md
      - CHANGELOG.md
    risk_level: CRITICAL
    requires_approval: true

  - id: V030-007
    title: Paper monitoring Telegram reports
    description: >-
      Deliver explainable live paper-monitoring reports and record outcomes at 5, 15, 30,
      60 minutes and 4 hours. Do not add order placement or trading permissions.
    acceptance_criteria:
      - Telegram report follows the constitution output contract.
      - Alerts have cooldown and invalidation updates.
      - Outcomes are recorded without changing the production model automatically.
      - No exchange trading endpoint exists in the implementation.
    allowed_paths:
      - research/monitor
      - research/evidence
      - tests/test_paper_monitor.py
      - configs/monitor.yaml
      - docker-compose.yml
      - README.md
      - CHANGELOG.md
    risk_level: CRITICAL
    requires_approval: true

  - id: V031-001
    title: GitHub Actions CI and release integrity
    description: >-
      Add a read-only GitHub Actions workflow for pushes and pull requests.
      Run the complete test suite, compile the Python packages, build and inspect
      the wheel, verify packaged configuration fallback and reject forbidden
      trading endpoints without requiring exchange credentials.
    acceptance_criteria:
      - CI runs for pushes and pull requests.
      - The complete pytest suite passes in a clean environment.
      - Compileall succeeds for research and orchestrator.
      - The Python wheel builds successfully.
      - The installed wheel can load its packaged default research configuration outside the repository.
      - CI rejects order placement, order cancellation, withdrawal and private trading endpoints in research.
      - No Binance API keys, exchange secrets or trading permissions are required.
      - Existing tests and safety requirements are not weakened.
    allowed_paths:
      - .github/workflows
      - scripts/ci
      - tests/test_ci_contract.py
      - tests/test_research_config_packaging.py
      - pyproject.toml
      - README.md
      - CHANGELOG.md
    risk_level: HIGH
    requires_approval: true

  - id: V031-002
    title: Strict paper monitor configuration and preflight
    description: >-
      Turn configs/monitor.yaml into a typed fail-closed runtime contract
      and add a read-only preflight command. Validate paper-only mode,
      local append-only outcome storage and every trading, credential,
      withdrawal and production-model safety flag before a live paper
      monitor process can start. Preflight must not contact exchanges
      or Telegram.
    acceptance_criteria:
      - The complete monitor YAML is parsed into immutable typed configuration used by paper-monitor components.
      - Missing or malformed configuration, missing required fields, unknown fields and unsafe values fail closed with clear errors.
      - Preflight rejects exchange credentials, order placement, order cancellation, withdrawals, automatic trading and production-model updates.
      - Preflight validates the configured local JSONL outcome path without sending Telegram messages or making exchange requests.
      - Preflight emits a deterministic redacted machine-readable report and exits non-zero on any failed check.
      - Safe configuration requires no Binance API keys, exchange secrets or trading permissions.
      - Tests cover safe configuration, malformed configuration, every unsafe safety flag, redaction and zero-network side effects.
      - Existing paper-monitor behavior, CI and safety tests remain passing and are not weakened.
    allowed_paths:
      - research/monitor
      - research/cli.py
      - tests/test_paper_monitor_config.py
      - tests/test_paper_monitor.py
      - configs/monitor.yaml
      - README.md
      - CHANGELOG.md
    risk_level: CRITICAL
    requires_approval: true

  - id: V031-003
    title: Deterministic local paper-monitor replay runtime
    description: >-
      Add a local deterministic replay command that runs the existing
      paper monitor against strictly validated alert and price events from
      local JSONL files. Require the existing fail-closed preflight, write
      messages and outcomes only to local append-only storage and perform
      no Binance or Telegram network requests.
    acceptance_criteria:
      - The replay command runs the existing paper-monitor preflight before reading runtime events.
      - Alert and price events use immutable strict typed schemas with unknown fields forbidden.
      - Events are read only from local JSONL files and processed in deterministic timestamp order.
      - The existing PaperMonitor provides cooldown, invalidation and outcome behavior without parallel implementations.
      - A local append-only JSONL sink records formatted monitor messages without contacting Telegram.
      - Restarting replay does not duplicate outcomes already present in the configured outcome store.
      - Missing files, malformed JSONL, invalid fields and unsafe values fail closed with non-zero exit status.
      - The command emits a deterministic redacted machine-readable run report.
      - Tests cover initial alerts, cooldown, invalidation, due outcomes, restart recovery, malformed input and zero-network behavior.
      - No order placement, order cancellation, outbound asset transfer, credential or automatic-trading capability is added.
    allowed_paths:
      - research/monitor
      - research/cli.py
      - tests/test_paper_monitor_runtime.py
      - tests/test_paper_monitor.py
      - configs/monitor.yaml
      - README.md
      - CHANGELOG.md
      - ROADMAP.yaml
    risk_level: HIGH
    requires_approval: true

  - id: V031-004
    title: Paper replay consistency and idempotency hardening
    description: >-
      Harden the deterministic local paper replay against inconsistent path
      resolution, partial failures, repeated runs and large malformed inputs.
      Preserve the existing PaperMonitor behavior, local append-only storage,
      fail-closed safety checks and zero-network paper-only architecture.
    acceptance_criteria:
      - Relative config paths are resolved once against project_root and the same resolved configuration is used by preflight and runtime.
      - An invalidation for an alert suppressed by cooldown is deterministically suppressed without aborting replay or writing an invalid message.
      - Failed run reports retain accurate counters for events and local records already processed before the failure.
      - Restarting replay does not duplicate formatted messages or outcomes already present in their local JSONL stores.
      - Existing message records receive deterministic identities and malformed existing message storage fails closed before new messages are appended.
      - JSONL inputs are read line by line with explicit limits for line size and event count instead of loading an unbounded file as text.
      - Deterministic timestamp ordering and strict immutable event validation remain unchanged.
      - Regression tests cover project-root config resolution, suppressed-alert invalidation, partial-failure reporting, message restart idempotency and bounded JSONL loading.
      - The complete test suite, lint checks, compilation and release-integrity checks remain passing without weakening existing safety controls.
      - No exchange transaction, outbound asset transfer, credential or automatic-trading capability is added.
    allowed_paths:
      - research/monitor
      - research/cli.py
      - tests/test_paper_monitor_runtime.py
      - tests/test_paper_monitor.py
      - README.md
      - CHANGELOG.md
      - ROADMAP.yaml
    risk_level: HIGH
    requires_approval: true
