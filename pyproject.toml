[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-dump-research"
version = "0.3.0.1"
description = "Explainable pump/dump research pipeline with controlled autonomous development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "rich>=13.7,<15",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.3,<5"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
pd-research = "research.cli:app"
pd-orchestrator = "orchestrator.cli:app"

[tool.setuptools.packages.find]
include = ["research*", "orchestrator*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
